<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Phone Mockup Frame inside App Icon -->
  <g transform="translate(136, 76)">
    <!-- Device Body -->
    <rect width="240" height="360" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="6" filter="url(#glow)" />
    <!-- Screen -->
    <rect width="220" height="340" x="10" y="10" rx="28" fill="#09090b" />
    
    <!-- Wallpaper artwork on phone screen -->
    <clipPath id="screenClip">
      <rect width="220" height="340" x="10" y="10" rx="28" />
    </clipPath>

    <g clip-path="url(#screenClip)">
      <!-- Gradient sky -->
      <rect width="220" height="340" x="10" y="10" fill="url(#bg)" />
      <!-- Glowing Sun/Moon -->
      <circle cx="120" cy="120" r="42" fill="url(#sun)" opacity="0.9" filter="url(#glow)" />
      <!-- Mountain Layer 1 -->
      <polygon points="10,260 70,170 140,260" fill="#6366f1" opacity="0.8" />
      <!-- Mountain Layer 2 -->
      <polygon points="60,280 150,150 240,280" fill="url(#grad1)" opacity="0.9" />
      <!-- Fore Mountains -->
      <polygon points="0,350 110,240 230,350" fill="#2e1065" />
      <!-- Star dots -->
      <circle cx="45" cy="65" r="2" fill="#ffffff" opacity="0.8" />
      <circle cx="180" cy="80" r="1.5" fill="#ffffff" opacity="0.7" />
      <circle cx="85" cy="95" r="2.5" fill="#ffffff" opacity="0.9" />
      <circle cx="160" cy="50" r="1.8" fill="#ffffff" opacity="0.6" />
      
      <!-- Screen Notch / Island -->
      <rect x="75" y="16" width="70" height="12" rx="6" fill="#000000" />
      
      <!-- Home indicator bar -->
      <rect x="75" y="336" width="70" height="4" rx="2" fill="rgba(255,255,255,0.6)" />
    </g>
  </g>
</svg>
